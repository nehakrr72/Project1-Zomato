apiVersion: apps/v1
kind: Deployment

metadata:
  name: zomato-deploy
  labels:
    app: zomato

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zomato

  template:
    metadata:
      labels:
        app: zomato

    spec:
      containers:
        - name: cont1
          image: nehakrr72/zomato_new:64e685aee92939815901ecd56d3c94211c25fc1f
          ports:
            - containerPort: 3000 #we are exposing 3000 n dockerfile.