apiVersion: apps/v1
kind: Deployment

metadata:
  name: zomato-deploy
  labels:
    app: zomato

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zomato

  template:
    metadata:
      labels:
        app: zomato

    spec:
      containers:
        - name: cont1
          image: nehakrr72/zomato_new:a87d209fa724ff2f4cde09bf3e88717cd29c95e5
          ports:
            - containerPort: 3000 #we are exposing 3000 n dockerfile.