apiVersion: apps/v1
kind: Deployment

metadata:
  name: zomato-deploy
  labels:
    app: zomato

spec:
  replicas: 2

  selector:
    matchLabels:
      app: zomato

  template:
    metadata:
      labels:
        app: zomato

    spec:
      containers:
        - name: cont1
          image: nehakrr72/zomato_new:b553767352d9c1c96c1d3415e1ff917f5774811f
          ports:
            - containerPort: 3000 #we are exposing 3000 n dockerfile.